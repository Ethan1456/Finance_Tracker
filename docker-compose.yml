version: "3.9"

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - appnet

  backend:
    build: ./backend
    env_file:
    - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - appnet

  db:
    image: mysql:8.0
    env_file:
    - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: FinanceTracker
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - appnet

networks:
  appnet:

volumes:
  db_data:
